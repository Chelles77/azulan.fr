<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - AZULAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a365d; --accent: #ff6b35; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
        header { background: white; padding: 1.5rem 2rem; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        table { width: 100%; background: white; border-collapse: collapse; margin: 1rem 0; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--primary); color: white; }
        .total { background: white; padding: 2rem; border-radius: 8px; text-align: right; }
        .total h3 { color: var(--primary); margin-bottom: 1rem; }
        .btn { background: var(--primary); color: white; padding: 0.75rem 2rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: var(--accent); }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛍️ AZULAN</div>
        <nav style="gap: 2rem; display: flex;">
            <a href="index.html" style="text-decoration: none; color: #000;">Accueil</a>
            <a href="categorie.html" style="text-decoration: none; color: #000;">Produits</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="color: var(--primary); margin-bottom: 1.5rem;">🛒 Mon Panier</h2>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Prix</th>
                    <th>Quantité</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="total">
            <h3>Total: <span id="total">0</span>€</h3>
            <button class="btn" onclick="checkout()">💳 Passer la commande</button>
        </div>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('azulan_cart') || '[]');
        const products = JSON.parse(localStorage.getItem('azulan_products') || '{}');
        
        function checkout() {
            if (cart.length === 0) {
                alert('❌ Votre panier est vide!');
                return;
            }
            window.location.href = 'success.html';
        }
    </script>
</body>
</html>
