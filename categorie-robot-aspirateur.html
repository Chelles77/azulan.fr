<!DOCTYPE html><html><head><meta charset=UTF-8><title>robot-aspirateur - AZULAN</title><style>body{font-family:Inter;background:#f5f5f5}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}header{background:white;padding:1.5rem;display:flex;justify-content:space-between}nav{display:flex;gap:2rem}nav a{text-decoration:none;color:#000}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}.product{background:white;padding:1.5rem;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.price{color:#ff6b35;font-weight:700}.btn{background:#1a365d;color:white;padding:0.5rem;border:none;border-radius:4px;cursor:pointer}</style></head><body><header><div>AZULAN</div><nav><a href=index.html>Accueil</a><a href=categorie.html>Produits</a></nav></header><div class=container><h2>robot-aspirateur</h2><div class=products id=products></div></div><script>const prods=JSON.parse(localStorage.getItem('azulan_products')||'{}');const c=document.getElementById('products');Object.values(prods).filter(p=>p.categorie==='Robot-aspirateur').forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML=`<h3>${p.nom}</h3><div class=price>${p.prix}EUR</div><button class=btn>Ajouter</button>`;c.appendChild(d)});</script></body></html>
