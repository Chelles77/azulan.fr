<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Electromenager - AZULAN</title><style>body{font-family:'Inter',sans-serif;background:#f5f5f5}.container{max-width:1200px;margin:2rem auto;padding:0 2rem}header{background:white;padding:1.5rem 2rem;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}nav{display:flex;gap:2rem}nav a{text-decoration:none;color:#000;font-weight:500}h2{color:#1a365d;margin-bottom:1.5rem}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}.product{background:white;padding:1.5rem;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}.product h3{color:#1a365d;margin-bottom:0.5rem}.price{font-size:1.5rem;color:#ff6b35;font-weight:700}.btn{background:#1a365d;color:white;padding:0.5rem 1rem;border:none;border-radius:4px;cursor:pointer;font-weight:600}.btn:hover{background:#ff6b35}</style></head><body><header><div style="font-size:1.8rem;font-weight:700;color:#1a365d">AZULAN</div><nav><a href="index.html">Accueil</a><a href="categorie.html">Produits</a><a href="connexion.html">Connexion</a></nav></header><div class="container"><h2>Electromenager</h2><div class="products" id="products"></div></div><script>const prods=JSON.parse(localStorage.getItem('azulan_products')||'{}');const container=document.getElementById('products');Object.values(prods).filter(p=>p.categorie==='Electromenager').forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML=`<h3>${p.nom}</h3><p>${p.marque||''}</p><div class="price">${p.prix}EUR</div><button class="btn">Ajouter</button>`;container.appendChild(d)});</script></body></html>
